name: Evidence transport contract
run-name: Evidence transport fixture ${{ github.sha }}
'on':
  push:
    branches:
      - 'stock-sleeve-evidence-ci-*'
permissions:
  contents: read
concurrency:
  group: evidence-transport-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evidence-transport:
    if: github.repository == 'thundergamescda/RocaSifter'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact transport candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, reviewed 2026-11-16
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Emit finite Bash evidence transport fixtures
        env:
          SS_CI_SOURCE_SHA: ${{ github.sha }}
        run: bash tools/test_ci_evidence_transport.sh
