name: Hosted portal browser acceptance
run-name: Hosted portal browser fixture ${{ github.sha }}
'on':
  push:
    branches:
      - 'stock-sleeve-browser-ci-*'
permissions:
  contents: read
concurrency:
  group: hosted-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  hosted-browser:
    if: github.repository == 'thundergamescda/RocaSifter'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the exact browser candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, reviewed 2026-11-16
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run isolated Linux hosted portal browser fixtures
        env:
          SS_CI_SOURCE_SHA: ${{ github.sha }}
          HOSTED_BROWSER_CI_BUILD_TIMEOUT_SECONDS: '600'
          HOSTED_BROWSER_CI_TEST_TIMEOUT_SECONDS: '1200'
        run: bash tools/run_hosted_browser_ci.sh
