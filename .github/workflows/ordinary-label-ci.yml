name: Ordinary receipt label service and regression acceptance
run-name: Ordinary label fixture ${{ github.sha }}

'on':
  push:
    branches:
      - 'stock-sleeve-ordinary-label-ci-*'

permissions:
  contents: read

concurrency:
  group: ordinary-label-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ordinary-label:
    if: github.repository == 'thundergamescda/RocaSifter'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact admitted ordinary-label source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run owned offline current-service fixture
        env:
          SS_ORDINARY_LABEL_SOURCE_SHA: ${{ github.sha }}
        run: bash tools/run_ordinary_label_ci.sh
