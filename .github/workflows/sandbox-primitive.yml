name: Linux namespace primitive diagnostic
run-name: Base-layer namespace diagnostic ${{ github.sha }}
'on':
  push:
    branches:
      - 'stock-sleeve-sandbox-ci-*'
permissions:
  contents: read
concurrency:
  group: sandbox-primitive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sandbox-primitive:
    if: github.repository == 'thundergamescda/RocaSifter'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, previously reviewed
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run finite base-layer namespace diagnostic
        env:
          SS_CI_SOURCE_SHA: ${{ github.sha }}
        run: bash tools/run_browser_primitive_ci.sh
